server:
  port: 8000
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: apigateway-service
  cloud:
    gateway:
      routes:
        - id : baobab-article
          uri : lb://BAOBAB-ARTICLE
          predicates:
            - Path=/api/article/**
          filters:
#            - ServiceApiPrivateFilter

        - id: baobab-users(private)
          uri: lb://BAOBAB-USERS
          predicates:
            - Path=/api/user/**
          filters:
#            - ServiceApiPrivateFilter

        - id: baobab-users(public)
          uri: lb://BAOBAB-USERS
          predicates:
            - Path=/open-api/user/**

# logging
logging:
  level:
    org:
      springframework.web: DEBUG
      hibernate: ERROR

log:
  config:
    path: logs