server:
  port: 8000
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  main:
   web-application-type: reactive
  application:
    name: apigateway-service
  cloud:
    gateway:
      routes:
        - id : baobab-article
          uri : lb://BAOBAB-ARTICLE
          predicates:
            - Path=/articles/**
        - id: baobab-files
          uri: lb://BAOBAB-FILES
          predicates:
            - Path=/files/**
        - id: baobab-users
          uri: lb://BAOBAB-USERS
          predicates:
            - Path=/users/**

# logging
logging:
  level:
    org:
      springframework.web: DEBUG
      hibernate: ERROR

log:
  config:
    path: logs