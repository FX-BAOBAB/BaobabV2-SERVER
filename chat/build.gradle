plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.fx'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // AOP
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Mongo
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // In-Memory Mongo
    testImplementation 'de.bwaldvogel:mongo-java-server:1.46.0'

    //Netflix eureka client
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client:4.2.0'
    implementation 'com.thoughtworks.xstream:xstream:1.4.21'
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'

    // QueryDSL
    implementation("com.querydsl:querydsl-mongodb:5.1.0") {
        exclude group: "org.mongodb", module: "mongo-java-driver"
    }
    implementation 'com.querydsl:querydsl-core:5.1.0'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0'
    annotationProcessor 'org.springframework.boot:spring-boot-starter-data-mongodb'

    //Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Embedded Kafka
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    // OpenFeign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    implementation project(":global")
    implementation project(":file")

}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2024.0.0"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}
