server:
  port: 0 # 랜덤 포트를 사용하기 위함

  servlet:
    session:
      cookie:
        name: JSESSIONID

spring:
  application:
    name: baobab-users

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  session:
    redis:
      namespace: baobab:session

  data:
    redis:
      host: localhost
      port: 6379
      password: baobab
      repositories:
        enabled: true

    mongodb:
      uri: mongodb://admin:admin@localhost:27017
      database: baobab

jwt:
  secret:
    key: shinyangjunglee_baobab_passwordkey
  access-token:
    plus-hour: 1
  refresh-token:
    plus-hour: 12

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.hostname}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

# logging
logging:
  level:
    org:
      springframework.web: DEBUG
      hibernate: ERROR

log:
  config:
    path: logs