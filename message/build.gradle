plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.fx'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Aop
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Mongo
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // Firebase admin
    implementation 'com.google.firebase:firebase-admin:9.4.3'
        // firebase admin 의존성 라이브러리 취약점 대응
    implementation 'io.netty:netty-common:4.1.119.Final'
    implementation 'io.netty:netty-handler:4.1.119.Final'

    // mockito
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-inline:4.11.0'

    //Netflix eureka client
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client:4.2.0'
    implementation 'com.thoughtworks.xstream:xstream:1.4.21'
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
        // eureka client 의존성 라이브러리 취약점 대응
    implementation 'org.springframework.security:spring-security-crypto:6.4.5'

    // Prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // In-Memory Mongo
    testImplementation 'de.bwaldvogel:mongo-java-server:1.46.0'

    implementation project(":global")
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}
